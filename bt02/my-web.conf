server {
    listen 80;
    listen [::]:80;

    # Thay đổi server_name phù hợp với domain hoặc IP của bạn
    server_name http://khanhhdxuan.duckdns.org/;

    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình trang lỗi 404 tùy chỉnh
    error_page 404 /404.html;

    # Bảo vệ file 404.html, ngăn người dùng truy cập trực tiếp URL /404.html
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }
}
